# GitHub accounts and repositories shown on the repositories page.

# Personal accounts only: the stats card service does not support organizations.
github_users:
  - novascone

repo_description_lines_max: 2

# Options for the stats card at the top (github-stats-extended). Separate with "&".
#   hide_rank=true          no letter grade
#   hide=stars,issues       drop metrics: stars, commits, prs, issues, contribs
#   show=prs_merged,reviews add metrics: reviews, prs_merged, prs_merged_percentage,
#                           discussions_started, discussions_answered
#   include_all_commits=true  count all-time commits instead of the last year
stats_card_options: "hide=stars,issues&include_all_commits=true&cache_seconds=14400"

# Options for the repository cards. cache_seconds=14400 makes GitHub changes
# (descriptions, languages) show up within about 4 hours instead of days.
repo_card_options: "cache_seconds=14400"

# Cards appear in this order. Organization repos work too, e.g. QGInt/<repo>.
github_repos:
  - novascone/dho-pinn
  - novascone/tree

# Organizations, listed as links (the stats card service cannot render them).
github_orgs:
  - login: QGInt
    name: Quantum and Gravitational Interactions
